name: Build Windows Prototype

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECHO_ALLOW_MISSING_LOCAL_ASSETS: '1'

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-resident.txt
      - run: pnpm install --frozen-lockfile
      - name: Install the locked Electron runtime
        run: node node_modules/electron/install.js
      - run: python -m pip install -r requirements-resident.txt
      - name: Offline Python service regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Audit all launcher and build dependencies
        run: pnpm audit --audit-level high
      - run: pnpm dist:win
      - name: Upload source-only prototype launcher (not a production game release)
        uses: actions/upload-artifact@v4
        with:
          name: echoverse-windows-portable-prototype-source-only
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
