name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The checkout is source-only. Locally licensed avatar assets are not required.
  ECHO_ALLOW_MISSING_LOCAL_ASSETS: '1'

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-resident.txt
      - run: pnpm install --frozen-lockfile
      - name: Install the locked Electron runtime
        run: node node_modules/electron/install.js
      - run: python -m pip install -r requirements-resident.txt
      - name: Offline Python service regression tests
        run: python -B -m unittest discover -s tests -v
      - run: pnpm check
      - name: Audit all launcher and build dependencies
        run: pnpm audit --audit-level high
